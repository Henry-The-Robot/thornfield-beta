<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Thornfield">
<meta name="theme-color" content="#1f2a1a"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Ledger & Crown — Spring at Thornfield</title>
<link rel="stylesheet" href="style.css?v=0.4.1"><link rel="stylesheet" href="verbs.css?v=0.4.1">
<link rel="stylesheet" href="market.css?v=0.4.1"><link rel="stylesheet" href="court.css?v=0.4.1">
<style>
  body{background:#1f2a1a;overflow:hidden;user-select:none}
  #wrap{position:relative;margin:0 auto}
  canvas#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
  .wood{background:#f1d9a6;border:3px solid #7a4a22;box-shadow:inset 0 0 0 2px #d9a55e,0 3px 0 #4a2c14;border-radius:6px;color:#3b2a1e}
  #hud{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;font:bold 14px var(--serif);pointer-events:none}
  #hud .wood{padding:3px 9px}#hud .k{font-weight:normal;color:#7a5a3a;font-size:12px;margin-right:4px}
  #hud .day{margin-right:auto}#hud .warn{color:#9b2335}
  #bar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:4px;padding:4px}
  #bar .slot{width:44px;height:44px;background:#e8c890;border:2px solid #9a6a3a;border-radius:4px;position:relative}
  #bar canvas{width:40px;height:40px;image-rendering:pixelated;margin:0}
  #bar b{position:absolute;right:2px;bottom:0;font:bold 13px var(--mono);color:#3b2a1e;text-shadow:0 0 2px #fff}
  #bar i{position:absolute;left:2px;top:0;font:10px var(--serif);color:#7a5a3a;font-style:normal}
  #hint{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);font:13px var(--serif);color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
  #bark{position:absolute;left:12px;bottom:66px;max-width:430px;padding:6px 10px;font:14px var(--serif);display:none}
  #bark b{color:#9b2335}
  #dlg{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);width:min(680px,94%);padding:10px 12px;display:none;gap:12px}
  #dlg canvas{width:72px;height:72px;image-rendering:pixelated;background:#cfe3b0;border:2px solid #9a6a3a;border-radius:4px;flex:none}
  #dlg .nm{font:bold 15px var(--serif);color:#7a2a1a}#dlg .ht{color:#c43a4a;letter-spacing:1px;font-size:14px;margin-left:6px}
  #dlg .tx{font:16px var(--serif);margin:4px 0 6px;line-height:1.35}
  #dlg button{font:14px var(--serif);background:#fff5dc;border:1px solid #9a6a3a;border-radius:3px;padding:4px 9px;margin:2px 4px 2px 0;cursor:pointer;color:#3b2a1e}
  #dlg button:hover{background:#ffe3a0}#dlg button:disabled{opacity:.45;cursor:default}
  #dlg button kbd{font:11px var(--mono);color:#9a6a3a;margin-right:4px}
  #night{position:absolute;inset:0;background:#0d0f1c;color:#f1d9a6;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s;font:18px var(--serif)}
  #night.on{opacity:1}#night h2{color:#f1d9a6;border:0;font-size:28px}#night p{margin:3px;font-size:15px;opacity:.9}
  .fl{position:absolute;font:bold 15px var(--mono);pointer-events:none;text-shadow:0 1px 0 #fff,0 0 3px #fff;animation:up 1.6s ease-out forwards;z-index:30}
  @keyframes up{to{transform:translateY(-34px);opacity:0}}
  #panel .modal{max-width:1080px}
  .stm{font-size:13.5px}.stm td.num{font-family:var(--mono)}.stm tr.sub td:first-child{padding-left:18px;color:var(--ink2)}
  .stm tr.hl td{background:#ffe27a}.stm tr.ask td{background:#bfe0ff}
  .stm h3{margin-top:0}.ok{color:var(--good);font-size:12px}
  .course{border-bottom:1px dotted var(--parch3);padding:4px 0}.course .ch{display:flex;gap:6px;font-size:14px}.course .ch span{margin-left:auto;font-size:12px;color:var(--faint)}
  .course.locked{opacity:.55}.bar{height:7px;background:var(--parch2);border-radius:4px;margin:3px 0 4px}.bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
  .courses{column-count:2;column-gap:22px}.course{break-inside:avoid}
  .cx{font-size:12.5px;display:flex;justify-content:space-between;padding:1px 0 1px 12px}.cx.unseen{color:var(--faint)}.cx.used span:last-child{color:var(--gold)}.cx.mastered span:last-child{color:var(--good);font-weight:bold}
  .diploma{margin-top:10px;padding:10px;border:2px dashed var(--parch3);text-align:center;color:var(--faint);font-variant:small-caps}
  .maudline{border-left:4px solid #ffcf3a;background:#fff5cf;padding:8px 12px;margin:10px 0;font-size:16px}
  .ezq{border-left:4px solid #5b7fc4;background:#eef4ff;padding:8px 12px;margin:10px 0}
  .banner{background:#9b2335;color:#fff;padding:8px 12px;border-radius:4px;margin-bottom:8px}
  .deskonly{display:none!important}body.desk .deskonly,.deskonly.spot{display:inline-block!important}
  .spot{outline:3px solid #ffcf3a;box-shadow:0 0 0 6px rgba(255,207,58,.45)!important;animation:pulse 1s ease-in-out infinite alternate}
  @keyframes pulse{to{box-shadow:0 0 0 10px rgba(255,207,58,.15)}}
  #goal{position:absolute;left:8px;top:46px;padding:4px 10px;font:bold 14px var(--serif);max-width:70%;display:none}#goal .k{display:block;font:11px var(--serif);color:#9b2335;letter-spacing:.06em;text-transform:uppercase}
  #coin{width:330px;padding:3px 8px}.coinmap{display:flex;height:18px;border-radius:3px;overflow:hidden;border:1px solid #7a4a22;background:#e9dab8;margin-top:2px}
  .coinmap div{transition:width .6s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;white-space:nowrap;overflow:hidden}
  #dlg .in input{font:16px var(--mono);width:180px;padding:4px 6px;border:2px solid #9a6a3a;border-radius:3px;background:#fffdf5}.hintline{color:#9b2335}
  #bar .slot.keys{width:auto;padding:4px 8px;font:12px var(--serif);color:#5a3a1a;line-height:1.5}
  .veil{filter:blur(5px);opacity:.35;pointer-events:none}.stm tr.pick{cursor:pointer}.stm tr.pick:hover td{background:#ffe9a8}
  .fcast td,.fcast th{padding:2px 8px}.fcast tr.ev td{background:#fff6dc}.fcast input{width:70px;font:14px var(--mono)}.fcast input.bad{background:#ffd6d6}.fcast input.good{background:#d9f2d9}.neg{color:#9b2335}
  .journal{background:#f6ecd2;border:1px solid #c9b183;padding:16px 20px;font:italic 19px "Segoe Script","Bradley Hand",cursive,var(--serif);color:#4a3526}.journal.small{font-size:15px;padding:8px 12px;display:block}.journal .sig{text-align:right}
  .nb{border-left:4px solid #ffcf3a;background:#fffaf0;padding:6px 10px;margin:8px 0}.nb b{color:#9b2335}

  /* ---- iPad and touch ---- */
  html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #hud .wood{pointer-events:auto}
  #tc{display:none}
  body.touch #tc{display:block}body.touch.inmodal #tc{display:none}
  #dpad{position:fixed;left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px;z-index:40}
  #dpad button[data-d=up]{grid-area:1/2}#dpad button[data-d=left]{grid-area:2/1}#dpad button[data-d=right]{grid-area:2/3}#dpad button[data-d=down]{grid-area:3/2}
  #dpad button,#act{opacity:.5;transition:opacity .12s;background:rgba(241,217,166,.78);border:3px solid #7a4a22;color:#3b2a1e;font:bold 24px var(--serif);border-radius:14px;touch-action:none;padding:0;box-shadow:0 3px 0 #4a2c14}
  #dpad button.down,#act:active{opacity:1;background:#ffcf3a;transform:translateY(2px);box-shadow:none}
  #act{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;font-size:16px;line-height:1.1;z-index:40}
  body.touch #hud{left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));gap:8px}
  body.touch #hud .wood{padding:8px 13px;font-size:17px;min-height:44px;display:flex;align-items:center}body.touch #hud .k{font-size:13px}
  body.touch #goal{top:calc(62px + env(safe-area-inset-top));font-size:16px}
  body.touch #menubtn{background:rgba(241,217,166,.92)!important;border:3px solid #7a4a22!important;color:#3b2a1e!important;box-shadow:0 3px 0 #4a2c14;top:calc(8px + env(safe-area-inset-top))!important;right:calc(8px + env(safe-area-inset-right))!important;min-height:44px;font-size:17px;padding:8px 16px}
  body.touch #hint{font-size:16px;bottom:78px}body.touch #bark{font-size:16px;bottom:78px}
  body.touch #bar{bottom:10px}body.touch #bar .slot{width:52px;height:52px}body.touch #bar canvas{width:46px;height:46px}
  body.touch #bar .slot.keys{height:52px;width:auto;padding:4px 6px;display:flex;flex-direction:row;gap:6px;align-items:center;font-size:0}
  body.touch #bar .slot.keys br{display:none}body.touch #bar .slot.keys .btn{min-height:40px;font-size:15px!important;padding:5px 12px!important;margin:0;background:#fff5dc;border:2px solid #9a6a3a;color:#3b2a1e}
  body.touch #bar{align-items:center}body.touch.inmodal #bar{display:none}
  body.touch #dlg{bottom:calc(84px + env(safe-area-inset-bottom));width:min(780px,96%);padding:12px 14px;max-height:78%;overflow:auto}
  body.touch #dlg.kb{bottom:auto;top:calc(60px + env(safe-area-inset-top))}
  body.touch #dlg .tx{font-size:18px;line-height:1.4}body.touch #dlg .nm{font-size:17px}
  body.touch #dlg button{min-height:48px;font-size:17px;padding:8px 16px;margin:5px 8px 5px 0}body.touch #dlg button kbd{display:none}
  body.touch #dlg .in{display:flex;align-items:center;gap:8px;margin:6px 0}
  body.touch #dlg .in input,body.touch .fcast input,body.touch input{font-size:18px;min-height:46px}
  body.touch .sgn,#dlg .sgn{min-height:46px;min-width:52px;font:bold 22px var(--serif);background:#fff5dc;border:2px solid #9a6a3a;border-radius:8px;color:#3b2a1e;padding:0 12px;margin:0 0 0 6px}
  body.touch .fcast .sgn{min-height:40px;min-width:42px;font-size:18px}
  body.touch .btn{min-height:46px;font-size:17px;padding:9px 18px}
  body.touch .choice{min-height:52px;font-size:17px}
  body.touch .stm tr.pick{height:44px}body.touch .stm{font-size:15.5px}
  body.touch .modal{max-height:92dvh;padding:18px 18px;-webkit-overflow-scrolling:touch}
  body.touch .pclose{min-height:46px}
</style>

<body>

  <canvas id="c" width="320" height="200"></canvas>
  <div id="hud"></div>
  <div id="goal" class="wood"></div>
  <div id="bark" class="wood"></div>
  <div id="hint"></div>
  <div id="dlg" class="wood"></div>
  <div id="bar" class="wood"></div>
  <div id="night"></div>
  <div id="travel"></div>
</div>
<div class="overlay" id="panel" style="display:none"><div class="modal" id="panelBody"></div></div>

<script src="engine.js?v=0.4.1"></script><script src="books.js?v=0.4.1"></script><script src="transcript.js?v=0.4.1"></script>
<script src="art.js?v=0.4.1"></script><script src="bot.js?v=0.4.1"></script><script src="market.js?v=0.4.1"></script><script src="fx.js?v=0.4.1"></script><script src="music.js?v=0.4.1"></script><script src="cast.js?v=0.4.1"></script><script src="practice.js?v=0.4.1"></script><script src="standing.js?v=0.4.1"></script>
