<!doctype html>
<html><head><meta charset="utf-8"><title>WS7 screenshot driver</title><style>body{margin:0;background:#111}iframe{border:0;display:block;width:1194px;height:834px}</style></head>
<body><iframe id="f"></iframe>
<!-- Drives the real game to one Market Day scene and stops, for a screenshot at 1194x834 (iPad landscape). Run:
     chrome --headless --allow-file-access-from-files --window-size=1194,834 --virtual-time-budget=20000 --screenshot=<out.png> "file:///.../tests/shot-market.html?scene=map|setup|bet|afternoon|pause|tally" -->
<script>
const P = new URLSearchParams(location.search), scene = P.get("scene") || "setup", sleep = ms => new Promise(r => setTimeout(r, ms)), f = document.getElementById("f");
f.src = "../game.html?sandbox=1&new=1&touch=" + (P.get("touch") || "1");
f.onload = async () => {
  const w = f.contentWindow; await sleep(300); const d = w.document, G = w.G, S = w.Spring, M = w.Market, s = G.s; G.closeDlg(); G.hidePanel();
  const click = id => d.getElementById(id).click(), buy = n => { S.post(s, "seed", "screenshot: sacks", { inv: n * 4, cash: -n * 4 }); s.sacks += n; };
  const price = (st, to) => { const n = to - st.price; for (let i = 0; i < Math.abs(n); i++) d.querySelector(`[data-st="price${n > 0 ? "+" : "-"}"]`).click(); };
  // play a whole fair quickly at the given prices per hour, stopping at the tally (or earlier: stopAfter = number of hours to play)
  const fair = async (day, prices, bring, stopAfter) => { s.day = day; buy(bring - s.sacks > 0 ? bring - s.sacks : 0); G.hud(); M.open(); await sleep(30); const st = M.debug.st; st.bring = Math.min(bring, s.sacks); st.fast = true; price(st, prices[0]); click("mk-open"); await sleep(30);
    if (st.phase === "bet") { d.querySelector('[data-bet="up"]').click(); await sleep(30); }
    for (let h = 1; h < (stopAfter || 3); h++) { price(st, prices[h]); click("mk-next"); await sleep(30); } return st; };
  if (scene === "map") { s.day = 7; buy(10); G.hud(); G.pl.x = 36 * 16 + 8; G.pl.y = 21 * 16 + 12; G.pl.dir = "right"; G.tick(1 / 60); }
  else if (scene === "setup") { s.day = 7; buy(10); G.hud(); M.open(); await sleep(30); M.debug.st.bring = 18; d.querySelector('[data-st="price+"]').click(); }
  else if (scene === "bet") { s.day = 14; buy(10); G.hud(); M.open(); await sleep(30); M.debug.st.bring = 18; d.querySelector('[data-st="price+"]').click(); click("mk-open"); await sleep(30); }
  else if (scene === "afternoon") { s.day = 14; buy(10); G.hud(); M.open(); await sleep(30); const st = M.debug.st; st.bring = 18; d.querySelector('[data-st="price+"]').click(); click("mk-open"); await sleep(30); d.querySelector('[data-bet="no"]').click(); await sleep(30); M.debug.seekBest(); await sleep(60); }
  else if (scene === "pause") { await fair(14, [9, 10, 9], 18, 1); }
  else if (scene === "tally") { await fair(7, [9, 10, 8], 18); click("mk-done"); await sleep(30); await fair(14, [9, 10, 9], 18); await sleep(60); }
  document.title = "ready " + scene;
};
</script></body></html>
